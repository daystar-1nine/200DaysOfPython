model:
  name: Medium
  vocab_size: 64
  context_length: 64
  embed_dim: 384
  num_heads: 8
  num_layers: 8
  dropout: 0.1
  tie_weights: true
  precision: fp32

training:
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 20
  max_steps: 200
  batch_size: 32
  gradient_accumulation_steps: 1
  weight_decay: 0.01
  grad_clip: 1.0
  eval_interval: 40
  eval_iters: 10
  seed: 42
  scheduler_type: cosine
