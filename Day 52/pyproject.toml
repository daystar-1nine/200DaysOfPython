[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-data-manager-v2"
version = "2.0.0"
description = "Student Data Management System V2 with JSON & CSV Serialization for Day 52"
authors = [{ name = "Suraj Sawant", email = "surajonenine@gmail.com" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
