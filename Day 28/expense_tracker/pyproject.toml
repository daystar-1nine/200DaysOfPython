[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "0.1.0"
description = "A professional CLI multi-user expense tracker with layered architecture"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
expense-tracker = "expense_tracker.main:main"
