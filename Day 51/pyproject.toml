[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-data-processor"
version = "1.0.0"
description = "Professional Python Student Data Processor CLI for Day 51"
authors = [{ name = "Suraj Sawant", email = "surajonenine@gmail.com" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
