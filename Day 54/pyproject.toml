[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "day54-numpy-fundamentals"
version = "1.0.0"
description = "Day 54 NumPy Fundamentals and Student Performance Analyzer"
authors = [{ name = "Suraj Sawant", email = "surajonenine@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
