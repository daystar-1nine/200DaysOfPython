[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "day53-sales-data-processing"
version = "1.0.0"
description = "Day 53 Sales Data Processing System"
authors = [{ name = "Suraj Sawant", email = "surajonenine@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
