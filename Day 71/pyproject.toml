[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "day71-ab-testing-engine"
version = "1.0.0"
description = "Day 71: Two-Sample Tests & A/B Testing Analysis Engine"
authors = [{ name = "Suraj Sawant", email = "surajonenine@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]
