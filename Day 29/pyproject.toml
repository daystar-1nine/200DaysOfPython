[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "day29-pytest-suite"
version = "0.1.0"
description = "Professional Testing Pytest Suite for Day 29"
requires-python = ">=3.10"

dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = [
    "tests",
    "expense_tracker_pytest",
    "api_client_pytest"
]
